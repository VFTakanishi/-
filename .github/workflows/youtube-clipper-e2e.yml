name: youtube-clipper E2E (real podcast)

# Manual, two-stage E2E run against a real YouTube podcast on windows-latest.
# Not part of the product and not run on every push (workflow_dispatch only).
#
# mode: analyze  -> download -> transcribe -> Stage1/Stage2 candidate
#                   selection, prints the 3 candidates for a human to
#                   review, and uploads output/<video_id>/{source,cache}
#                   as an artifact so the render stage can reuse the exact
#                   same transcript/candidates without re-running Whisper
#                   or Claude (LLM output isn't guaranteed identical
#                   between calls, so this is required for correctness,
#                   not just speed).
# mode: render   -> downloads that artifact (via source_run_id), renders
#                   the chosen candidate_id, runs Technical + Content QA,
#                   and uploads the resulting mp4 (only if QA allows
#                   download) plus thumbnails as an artifact.
#
# Does not touch product code (src/podcast_clipper/) or the 14 absolute
# conditions, and never merges to main.

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "Podcast video URL (used in analyze mode)"
        required: false
        type: string
      mode:
        description: "analyze or render"
        required: true
        type: choice
        options:
          - analyze
          - render
        default: analyze
      video_id:
        description: "video_id from the analyze step's output (required for render)"
        required: false
        type: string
      candidate_id:
        description: "c1 / c2 / c3 (required for render)"
        required: false
        type: string
      source_run_id:
        description: "run id of the analyze run to pull cached data from (required for render)"
        required: false
        type: string

jobs:
  e2e:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: youtube-clipper
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check / install ffmpeg
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y
          }
          ffmpeg -version
          ffprobe -version

      # yt-dlp's YouTube extractor increasingly needs a JS runtime to solve
      # challenges during real downloads (the smoke test's metadata-only
      # fetch warned about this). Deno is yt-dlp's default supported runtime.
      - name: Set up Deno (JS runtime for yt-dlp's YouTube extraction)
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
          pip install -U "yt-dlp[default]"

      # Same font-resolution logic as the smoke test workflow.
      - name: Ensure a Japanese font is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $candidates = @(
            "C:/Windows/Fonts/meiryo.ttc",
            "C:/Windows/Fonts/YuGothM.ttc",
            "C:/Windows/Fonts/YuGothR.ttc",
            "C:/Windows/Fonts/msgothic.ttc",
            "C:/Windows/Fonts/msmincho.ttc"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($found) {
            Write-Host "Using built-in Windows Japanese font: $found"
            $fontPath = $found
          } else {
            Write-Host "No built-in Japanese font found; downloading a licensed (SIL OFL) fallback."
            $release = (gh api repos/googlefonts/noto-cjk/releases/latest) | ConvertFrom-Json
            $asset = $release.assets | Where-Object { $_.name -match "(?i)sans.*\.zip" } | Select-Object -First 1
            if (-not $asset) { throw "Could not find a Sans-family zip asset in the latest googlefonts/noto-cjk release" }
            $zipPath = Join-Path $env:RUNNER_TEMP "noto-cjk.zip"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
            $extractDir = Join-Path $env:RUNNER_TEMP "noto-cjk"
            Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
            $jpFont = Get-ChildItem -Path $extractDir -Recurse -Include "*.otf", "*.ttc", "*.ttf" |
              Where-Object { $_.Name -match "(?i)jp|japan" } | Select-Object -First 1
            if (-not $jpFont) { throw "Downloaded Noto CJK archive did not contain a Japanese-specific font file" }
            $fontPath = $jpFont.FullName
          }

          "PODCAST_CLIPPER_FONT_PATH=$fontPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "PODCAST_CLIPPER_FONT_PATH set to: $fontPath"

      # --- analyze mode ----------------------------------------------------
      - name: Check ANTHROPIC_API_KEY is configured (analyze mode)
        if: ${{ inputs.mode == 'analyze' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANTHROPIC_API_KEY)) {
            Write-Host "::error::ANTHROPIC_API_KEY is not set as a repository secret. Add it under Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          }
          Write-Host "ANTHROPIC_API_KEY is configured."

      - name: Run analyze (download -> transcribe -> Stage1/Stage2 candidates)
        id: analyze
        if: ${{ inputs.mode == 'analyze' }}
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ inputs.youtube_url }}")) {
            throw "youtube_url input is required for mode=analyze"
          }
          python -m podcast_clipper.cli analyze "${{ inputs.youtube_url }}" | Tee-Object -FilePath analyze_result.json
          if ($LASTEXITCODE -ne 0) { throw "analyze failed" }

          $result = Get-Content analyze_result.json -Raw | ConvertFrom-Json
          "video_id=$($result.video_id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          "## 解析結果: $($result.video_title)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "video_id: ``$($result.video_id)``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          foreach ($c in $result.candidates) {
            $duration = ($c.segments | ForEach-Object { $_.end - $_.start } | Measure-Object -Sum).Sum
            "### 候補 $($c.id): $($c.title)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "- hook_type: $($c.hook_type)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "- 尺: $([math]::Round($duration, 1))秒" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "- スコア: $($c.score)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            foreach ($s in $c.segments) {
              "  - [$($s.role)] $([math]::Round($s.start,1))s - $([math]::Round($s.end,1))s: $($s.text)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
            "- 選定理由: $($c.reasoning)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            if ($c.caveats) { "- 注意点: $($c.caveats)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload analyze cache/source artifact
        if: ${{ inputs.mode == 'analyze' }}
        uses: actions/upload-artifact@v4
        with:
          name: analyze-${{ steps.analyze.outputs.video_id }}
          path: youtube-clipper/output/${{ steps.analyze.outputs.video_id }}
          retention-days: 7

      # --- render mode -------------------------------------------------------
      - name: Download analyze artifact (render mode)
        if: ${{ inputs.mode == 'render' }}
        uses: actions/download-artifact@v4
        with:
          name: analyze-${{ inputs.video_id }}
          path: youtube-clipper/output/${{ inputs.video_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run render (render -> Technical QA -> Content QA)
        id: render
        if: ${{ inputs.mode == 'render' }}
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ inputs.video_id }}") -or [string]::IsNullOrWhiteSpace("${{ inputs.candidate_id }}")) {
            throw "video_id and candidate_id inputs are required for mode=render"
          }
          python -m podcast_clipper.cli render "${{ inputs.video_id }}" "${{ inputs.candidate_id }}" | Tee-Object -FilePath render_result.json
          if ($LASTEXITCODE -ne 0) { throw "render failed" }

          $result = Get-Content render_result.json -Raw | ConvertFrom-Json
          "download_allowed=$($result.download_allowed)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          "## レンダリング結果: 候補 ${{ inputs.candidate_id }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| QAチェック | 結果 | 詳細 |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "|---|---|---|" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          foreach ($check in $result.qa_checks) {
            $mark = if ($check.passed) { "PASS" } elseif ($check.critical) { "FAIL(重大)" } else { "警告" }
            "| $($check.name) | $mark | $($check.detail) |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "**ダウンロード可否: $($result.download_allowed)**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload render output (mp4 + thumbnails)
        if: ${{ inputs.mode == 'render' }}
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ inputs.video_id }}-${{ inputs.candidate_id }}
          path: youtube-clipper/output/${{ inputs.video_id }}/renders
          retention-days: 7
