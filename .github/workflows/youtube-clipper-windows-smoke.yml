name: youtube-clipper Windows smoke test

# Diagnostic-only workflow for the youtube-clipper tool (not part of the
# product itself). Verifies, on a real Windows runner with normal internet
# access, the things the cloud Linux sandbox used for development could not:
# ffmpeg/ffprobe availability, the Windows Japanese font path, and
# faster-whisper fetching its model from Hugging Face.
# No product code or the 14 absolute conditions are touched by this file.

on:
  push:
    branches:
      - claude/youtube-podcast-clip-tool-1qwqlh
    paths:
      - "youtube-clipper/**"
      - ".github/workflows/youtube-clipper-windows-smoke.yml"
  workflow_dispatch: {}

jobs:
  windows-smoke:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: youtube-clipper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --- 3. ffmpeg / ffprobe -------------------------------------------
      - name: Check / install ffmpeg
        id: ffmpeg_check
        if: always()
        continue-on-error: true
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg -version failed" }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw "ffprobe -version failed" }

      # --- 4. Python dependencies -----------------------------------------
      - name: Install Python dependencies
        id: pip_install
        if: always()
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          if ($LASTEXITCODE -ne 0) { throw "pip install -e . failed" }
          pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install -r requirements.txt failed" }
          pip install pytest httpx
          if ($LASTEXITCODE -ne 0) { throw "pip install pytest httpx failed" }

      # --- 5. Japanese font -------------------------------------------------
      # Checks several fonts normally present on a real Windows install
      # (meiryo.ttc first, since that's the product's documented default).
      # GitHub-hosted windows-latest runner images are Windows Server based
      # and may be missing some of these (this is what step 1's smoke run
      # found), so only if none are present does this fall back to a
      # CI-only download of a freely licensed (SIL OFL) Japanese font,
      # discovered dynamically via the GitHub API rather than a hardcoded
      # URL. Either way, PODCAST_CLIPPER_FONT_PATH is exported for the
      # later steps (faster-whisper isn't affected, but pytest is).
      - name: Ensure a Japanese font is available
        id: font_check
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $candidates = @(
            "C:/Windows/Fonts/meiryo.ttc",
            "C:/Windows/Fonts/YuGothM.ttc",
            "C:/Windows/Fonts/YuGothR.ttc",
            "C:/Windows/Fonts/msgothic.ttc",
            "C:/Windows/Fonts/msmincho.ttc"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($found) {
            Write-Host "Using built-in Windows Japanese font: $found"
            $fontPath = $found
          } else {
            Write-Host "No built-in Japanese font found on this runner image ($($candidates -join ', ')). Falling back to a CI-only download of a licensed Japanese font (SIL OFL)."
            $releaseJson = gh api repos/googlefonts/noto-cjk/releases/latest
            if (-not $releaseJson) { throw "Could not query googlefonts/noto-cjk releases via gh api" }
            $release = $releaseJson | ConvertFrom-Json
            $asset = $release.assets | Where-Object { $_.name -match "(?i)sans.*\.zip" } | Select-Object -First 1
            if (-not $asset) { throw "Could not find a Sans-family zip asset in the latest googlefonts/noto-cjk release" }

            Write-Host "Downloading font asset: $($asset.name)"
            $zipPath = Join-Path $env:RUNNER_TEMP "noto-cjk.zip"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
            $extractDir = Join-Path $env:RUNNER_TEMP "noto-cjk"
            Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force

            $jpFont = Get-ChildItem -Path $extractDir -Recurse -Include "*.otf", "*.ttc", "*.ttf" |
              Where-Object { $_.Name -match "(?i)jp|japan" } | Select-Object -First 1
            if (-not $jpFont) { throw "Downloaded Noto CJK archive did not contain a Japanese-specific font file" }

            $fontPath = $jpFont.FullName
            Write-Host "Using downloaded Japanese font: $fontPath"
          }

          if (-not (Test-Path $fontPath)) { throw "Resolved font path does not exist: $fontPath" }
          "PODCAST_CLIPPER_FONT_PATH=$fontPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "PODCAST_CLIPPER_FONT_PATH set to: $fontPath"

      # --- 6. faster-whisper large-v3 / cpu / int8, real Hugging Face fetch
      - name: faster-whisper large-v3 model download (Hugging Face)
        id: whisper_check
        if: always()
        continue-on-error: true
        run: |
          python -c "from faster_whisper import WhisperModel; WhisperModel('large-v3', device='cpu', compute_type='int8'); print('WHISPER_MODEL_OK')"
          if ($LASTEXITCODE -ne 0) { throw "faster-whisper large-v3 model download/init failed" }

      # --- 8. pytest tests/ (expect 51 on Linux; verifying on Windows) ----
      - name: Run pytest suite
        id: pytest_check
        if: always()
        continue-on-error: true
        run: |
          pytest tests/ -v
          if ($LASTEXITCODE -ne 0) { throw "pytest tests/ failed" }

      # --- 9. Clear summary in the Actions log/UI --------------------------
      - name: Summarize results
        if: always()
        run: |
          $rows = @(
            @{Name="ffmpeg / ffprobe"; Outcome="${{ steps.ffmpeg_check.outcome }}"},
            @{Name="pip install (依存関係)"; Outcome="${{ steps.pip_install.outcome }}"},
            @{Name="日本語フォント確保"; Outcome="${{ steps.font_check.outcome }}"},
            @{Name="faster-whisper large-v3 取得 (Hugging Face)"; Outcome="${{ steps.whisper_check.outcome }}"},
            @{Name="pytest tests/"; Outcome="${{ steps.pytest_check.outcome }}"}
          )

          "## youtube-clipper Windows Smoke Test" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Check | Result |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "|---|---|" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          $anyFailed = $false
          foreach ($r in $rows) {
            if ($r.Outcome -eq "success") {
              $mark = "PASS"
            } else {
              $mark = "FAIL ($($r.Outcome))"
              $anyFailed = $true
            }
            "| $($r.Name) | $mark |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Write-Host "$($r.Name): $mark"
          }

          if ($anyFailed) {
            Write-Host "One or more smoke checks failed; see the table above and the individual step logs for details."
            exit 1
          }
