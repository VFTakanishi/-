# Railway build/deploy config (see CLOUD_DEPLOY.md). Assumes Railway's
# "Root Directory" is set to youtube-clipper/, so Dockerfile here refers to
# youtube-clipper/Dockerfile.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
