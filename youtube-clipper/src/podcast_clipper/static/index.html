<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Podcast Clipper</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<main class="app">
  <h1>ポッドキャスト切り抜きツール</h1>

  <section id="analyze-section" class="card">
    <h2>1. 動画ファイルをアップロード</h2>
    <div id="dropzone" class="dropzone">
      <p>ここに動画ファイルをドラッグ＆ドロップ</p>
      <p>または</p>
      <label class="file-label">
        ファイルを選択
        <input id="file-input" type="file" accept="video/*" hidden />
      </label>
      <div id="file-info" class="file-info hidden"></div>
    </div>
    <div class="row">
      <button id="analyze-btn" disabled>解析開始</button>
    </div>
    <div id="upload-progress" class="status hidden"></div>
    <div id="analyze-status" class="status"></div>
    <div id="refresh-candidates-box" class="hidden">
      <p class="hint">文字起こしとStage1候補は再利用します。Claudeへの新規要求はStage2ランキング1回だけです。</p>
      <button id="refresh-candidates-btn">保存済み解析から候補を選び直す</button>
    </div>
    <div id="refresh-stage1-box" class="hidden">
      <p class="hint">文字起こしは再利用します。Stage1候補をClaudeで作り直し、必要ならStage2ランキングを1回実行します。Whisperは再実行しません。</p>
      <button id="refresh-stage1-btn">文字起こしを再利用して候補解析をやり直す</button>
    </div>
  </section>

  <section id="candidates-section" class="card hidden">
    <h2>2. 候補（3件）から1件を選択</h2>
    <div id="candidates" class="candidates"></div>
  </section>

  <section id="render-section" class="card hidden">
    <h2>3. レンダリング＆QA</h2>
    <div id="render-status" class="status"></div>
    <div id="qa-report"></div>
    <div id="related-video-guidance" class="guidance hidden">
      <strong>本編への誘導設定</strong>
      <p id="related-video-text"></p>
    </div>
    <button id="download-btn" class="hidden" disabled>ダウンロード</button>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
